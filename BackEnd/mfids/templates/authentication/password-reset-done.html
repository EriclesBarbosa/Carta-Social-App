{% extends "layouts/base-auth.html" %}
{% load static %}

{% block content %}

<div class="flex flex-col items-center justify-center px-6 pt-8 mx-auto md:h-screen pt:mt-0 dark:bg-gray-900">
    <a href="/" class="flex items-center justify-center mb-8 text-2xl font-semibold lg:mb-10 dark:text-white">
        <img src="{% static 'dist/images/01logo.png' %}" class="mr-4 h-11" alt="MFIDS Logo">
        <span>MFIDS</span>  
    </a>
    <!-- Card -->
    <div class="w-full max-w-xl p-6 space-y-8 bg-white rounded-lg shadow sm:p-8 dark:bg-gray-800">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
            E-mail Enviado
        </h2>
        <span class="block text-sm font-medium text-gray-500 dark:text-gray-400">Foi enviado um e-mail para o teu endereço de e-mail. Por favor, clica no link e redefine a tua palavra-passe.</span>
        <a href="{% url 'signin' %}" class="block ml-auto text-sm text-primary-700 hover:underline dark:text-primary-500">Voltar ao login</a>
    </div>
</div>

{% endblock content %}
