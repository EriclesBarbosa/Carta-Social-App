<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redefinição de Senha - MFIDS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            color: #51545e;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: none;
        }
        .email-wrapper {
            width: 100%;
            background-color: #f4f4f7;
            padding: 20px;
        }
        .email-content {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #eaeaef;
            border-radius: 5px;
        }
        .email-header {
            text-align: center;
            padding: 10px 0;
        }
        .email-header h1 {
            margin: 0;
            font-size: 24px;
            color: #333333;
        }
        .email-header img {
            max-width: 150px;
            margin-bottom: 10px;
        }
        .email-body {
            padding: 20px 0;
        }
        .email-body p {
            font-size: 16px;
            line-height: 1.5;
            color: #51545e;
        }
        .email-body a {
            display: inline-block;
            padding: 10px 20px;
            margin: 20px 0;
            background-color: #3869d4;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .email-footer {
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            color: #999999;
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-content">
            <div class="email-header">
                <img src="https://embaixadadecaboverde.pt/documents/120558/0/armasCV.png/27f2ad11-258c-b7e0-2fd9-b11b6926d35e?t=1542373867722" alt="MFIDS Logo">
                <h1>MFIDS</h1>
            </div>
            <div class="email-body">
                <p>Olá,</p>
                <p>Recebeste um pedido para redefinir a tua palavra-passe. Utiliza o seguinte link para prosseguir:</p>
                <p><a href="{{ reset_link }}">Redefinir Palavra-Passe</a></p>
                <p>Se você não solicitou essa alteração, ignore este e-mail.</p>
            </div>
            <div class="email-footer">
                <p>Obrigado,<br>Sua equipe de suporte MFIDS</p>
            </div>
        </div>
    </div>
</body>
</html>
