<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redefinição de Senha - TechWash</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            color: #51545e;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: none;
        }
        .email-wrapper {
            width: 100%;
            background-color: #f4f4f7;
            padding: 20px;
        }
        .email-content {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #eaeaef;
            border-radius: 5px;
        }
        .email-header {
            text-align: center;
            padding: 10px 0;
        }
        .email-header h1 {
            margin: 0;
            font-size: 24px;
            color: #333333;
        }
        .email-header img {
            max-width: 150px;
            margin-bottom: 10px;
        }
        .email-body {
            padding: 20px 0;
        }
        .email-body p {
            font-size: 16px;
            line-height: 1.5;
            color: #51545e;
        }
        .email-body a {
            display: inline-block;
            padding: 10px 20px;
            margin: 20px 0;
            background-color: #3869d4;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .email-footer {
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            color: #999999;
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-content">
            <div class="email-header">
                <img src="https://th.bing.com/th/id/R.0045efb786bd2a31a8718d1b68a19173?rik=clKrG2j%2fDIGs8g&pid=ImgRaw&r=0" alt="TechWash Logo">
                <h1>TechWash</h1>
            </div>
            <div class="email-body">
                <p>Olá,</p>
                <p>Você solicitou uma redefinição de senha. Use o codigo abaixo para redefinir sua senha:</p>
                <p>Codigo: <b>{{reset_password_code}}</b></p>
                <p>Se você não solicitou essa alteração, ignore este e-mail.</p>
            </div>
            <div class="email-footer">
                <p>Obrigado,<br>Sua equipe de suporte TechWash</p>
            </div>
        </div>
    </div>
</body>
</html>
